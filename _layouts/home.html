---
---
{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="HandheldFriendly" content="True">

    {% include seo.html %}

    <script>(function(){try{var s=localStorage.getItem('theme');if(s)document.documentElement.setAttribute('data-theme',s);}catch(e){}})();</script>

    <link rel="icon" type="image/png" sizes="32x32" href="{{ base_path }}/images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ base_path }}/images/favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg:        #f1f2f6;
        --surface:   #ffffff;
        --ink:       #14161c;
        --muted:     #545965;
        --faint:     #888d9a;
        --rule:      #dfe1e9;
        --rule-soft: #e9ebf1;
        --accent:    #2743cf;
        --accent-ink:#1e34a6;
        --mark:      rgba(39,67,207,0.12);
        --sans: "Archivo", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mono: "Space Mono", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg:#0b0d12; --surface:#13151b; --ink:#e6e8ef; --muted:#969bab; --faint:#646979;
          --rule:#232733; --rule-soft:#1a1d27; --accent:#7d92ff; --accent-ink:#93a4ff; --mark:rgba(125,146,255,0.16);
        }
      }
      :root[data-theme="light"] {
        --bg:#f1f2f6; --surface:#ffffff; --ink:#14161c; --muted:#545965; --faint:#888d9a;
        --rule:#dfe1e9; --rule-soft:#e9ebf1; --accent:#2743cf; --accent-ink:#1e34a6; --mark:rgba(39,67,207,0.12);
      }
      :root[data-theme="dark"] {
        --bg:#0b0d12; --surface:#13151b; --ink:#e6e8ef; --muted:#969bab; --faint:#646979;
        --rule:#232733; --rule-soft:#1a1d27; --accent:#7d92ff; --accent-ink:#93a4ff; --mark:rgba(125,146,255,0.16);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 17px;
        line-height: 1.62;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      a { color: inherit; }

      .wrap { max-width: 840px; margin: 0 auto; padding: 0 28px 120px; }
      @media (max-width: 620px) { .wrap { padding: 0 20px 80px; } }

      /* Theme toggle */
      .theme-toggle {
        position: fixed; top: 16px; right: 16px; z-index: 20;
        font-family: var(--mono); font-size: 0.72rem;
        background: var(--surface); color: var(--muted);
        border: 1px solid var(--rule); border-radius: 999px;
        padding: 6px 13px; cursor: pointer;
        transition: color 0.16s ease, border-color 0.16s ease;
      }
      .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

      /* Masthead */
      .mast {
        display: flex; align-items: flex-end; justify-content: space-between;
        flex-wrap: wrap; gap: 20px 32px;
        padding: 110px 0 26px; border-bottom: 2px solid var(--ink);
      }
      @media (max-width: 620px) { .mast { padding-top: 74px; } }
      .mast .id { display: flex; align-items: center; gap: 22px; min-width: 0; }
      .portrait {
        width: 104px; height: 128px; flex: none;
        object-fit: cover; object-position: 50% 30%;
        border: 1px solid var(--rule); border-radius: 6px; background: var(--surface);
      }
      @media (max-width: 620px) { .portrait { width: 82px; height: 102px; gap: 16px; } }
      .mast h1 {
        font-size: clamp(2.5rem, 7vw, 3.9rem); font-weight: 700;
        letter-spacing: -0.038em; line-height: 0.92; margin: 0;
      }
      .mast h1 .dot { color: var(--accent); }
      .mast .aside { text-align: right; display: flex; flex-direction: column; gap: 9px; padding-bottom: 6px; }
      @media (max-width: 620px) { .mast .aside { text-align: left; } }
      .mast .where { font-family: var(--mono); font-size: 0.74rem; letter-spacing: 0.02em; color: var(--muted); line-height: 1.5; }
      .mast .nav { display: flex; gap: 16px; justify-content: flex-end; }
      @media (max-width: 620px) { .mast .nav { justify-content: flex-start; } }
      .mast .nav a {
        font-family: var(--mono); font-size: 0.76rem; text-decoration: none; color: var(--ink);
        display: inline-flex; align-items: center; gap: 6px; transition: color 0.16s ease;
      }
      .mast .nav a:hover { color: var(--accent); }
      .ico { width: 13px; height: 13px; flex: none; display: block; }

      /* Intro */
      .intro { display: grid; grid-template-columns: 132px 1fr; column-gap: 28px; padding: 34px 0 8px; }
      @media (max-width: 620px) { .intro { grid-template-columns: 1fr; gap: 12px; } }
      .intro .tag { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); padding-top: 6px; }
      .intro p { margin: 0; font-size: 1.1rem; line-height: 1.55; color: var(--ink); max-width: 58ch; }
      .intro p + p { margin-top: 0.85em; }
      .intro p:first-child { font-weight: 600; }
      .intro p .sub { color: var(--muted); }
      .mark {
        background: linear-gradient(var(--mark), var(--mark));
        background-size: 100% 44%; background-repeat: no-repeat; background-position: 0 86%;
        padding: 0 1px; font-weight: 600;
      }
      .interests { grid-column: 2; margin-top: 18px; font-family: var(--mono); font-size: 0.76rem; color: var(--muted); letter-spacing: 0.01em; }
      @media (max-width: 620px) { .interests { grid-column: 1; } }
      .interests span { color: var(--accent); }

      /* Section eyebrow */
      .eyebrow { display: grid; grid-template-columns: 132px 1fr; column-gap: 28px; align-items: center; margin: 66px 0 4px; }
      @media (max-width: 620px) { .eyebrow { grid-template-columns: 1fr; } }
      .eyebrow .n { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); }
      .eyebrow .ln { height: 1px; background: var(--rule); }
      @media (max-width: 620px) { .eyebrow .ln { display: none; } }

      /* Ledger rows */
      .row { display: grid; grid-template-columns: 132px 1fr; column-gap: 28px; padding: 22px 0; border-top: 1px solid var(--rule-soft); }
      .row:last-child { border-bottom: 1px solid var(--rule-soft); }
      @media (max-width: 620px) { .row { grid-template-columns: 1fr; gap: 10px; padding: 20px 0; } }
      .row .marg { display: flex; flex-direction: column; gap: 5px; padding-top: 3px; }
      @media (max-width: 620px) { .row .marg { flex-direction: row; align-items: baseline; gap: 10px; } }
      .marg .yr { font-family: var(--mono); font-size: 0.82rem; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
      .marg .vn { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
      .marg .vn.pre { color: var(--faint); }

      /* Publication body */
      .pub .title {
        font-size: clamp(1.12rem, 2.4vw, 1.3rem); font-weight: 600; letter-spacing: -0.012em;
        line-height: 1.3; margin: 0 0 9px; text-wrap: balance; transition: color 0.16s ease;
      }
      .row:hover .pub .title { color: var(--accent-ink); }
      .pub .authors { font-size: 0.93rem; color: var(--muted); line-height: 1.55; margin: 0 0 13px; }
      .pub .me {
        color: var(--ink); font-weight: 600;
        background: linear-gradient(var(--mark), var(--mark));
        background-size: 100% 42%; background-repeat: no-repeat; background-position: 0 90%; padding: 0 1px;
      }
      .pub .out { display: flex; flex-wrap: wrap; gap: 16px; }
      .pub .out a {
        font-family: var(--mono); font-size: 0.75rem; text-decoration: none; color: var(--muted);
        display: inline-flex; align-items: center; gap: 5px; padding-bottom: 1px;
        border-bottom: 1px solid var(--rule); transition: color 0.16s ease, border-color 0.16s ease;
      }
      .pub .out a:hover { color: var(--accent); border-color: var(--accent); }
      .pub .out a .ar { color: var(--faint); font-size: 0.72rem; }
      .pub .out a:hover .ar { color: var(--accent); }

      /* News / Education body */
      .say { font-size: 1rem; color: var(--ink); line-height: 1.55; margin: 0; }
      .say b { font-weight: 600; }
      .say i { font-style: italic; color: var(--muted); }
      .row .body .deg { font-weight: 600; font-size: 1.02rem; }
      .row .body .school { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }

      /* Footer */
      .site-foot { display: grid; grid-template-columns: 132px 1fr; column-gap: 28px; margin-top: 72px; padding-top: 22px; border-top: 2px solid var(--ink); }
      @media (max-width: 620px) { .site-foot { grid-template-columns: 1fr; gap: 8px; } }
      .site-foot .l, .site-foot .r { font-family: var(--mono); font-size: 0.72rem; color: var(--faint); }
      .site-foot .r { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

      /* Hero photo plate */
      .plate { margin: 30px 0 4px; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; background: var(--surface); }
      .plate img { display: block; width: 100%; height: clamp(210px, 33vw, 330px); object-fit: cover; object-position: 50% 42%; }
      .plate .cap {
        font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.04em; color: var(--faint);
        padding: 9px 14px; border-top: 1px solid var(--rule);
        display: flex; justify-content: space-between; gap: 12px;
      }
      .plate .cap .r { color: var(--accent); }

      /* Publication figure thumbnails */
      .row.figrow { grid-template-columns: 132px 1fr 210px; }
      @media (max-width: 820px) { .row.figrow { grid-template-columns: 1fr; } }
      .fig {
        display: block; align-self: start; border: 1px solid var(--rule); border-radius: 5px;
        overflow: hidden; background: var(--surface); padding: 5px;
        transition: border-color 0.16s ease, transform 0.16s ease;
      }
      .fig img { display: block; width: 100%; height: auto; border-radius: 2px; }
      .row.figrow:hover .fig { border-color: var(--accent); transform: translateY(-2px); }
      @media (max-width: 820px) {
        .fig { max-width: 460px; margin-top: 6px; }
      }

      /* Motion */
      @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
      .rise { animation: rise 0.55s cubic-bezier(0.2,0.7,0.2,1) both; }
      .d1{animation-delay:.04s}.d2{animation-delay:.1s}.d3{animation-delay:.16s}.d4{animation-delay:.22s}
      @media (prefers-reduced-motion: reduce) { .rise { animation: none; } html { scroll-behavior: auto; } }
      a:focus-visible, .theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
    </style>
  </head>

  <body>
    <button id="themeBtn" class="theme-toggle" type="button" aria-label="Toggle color theme">Dark</button>

    <div class="wrap">
      {{ content }}
    </div>

    {% include analytics.html %}

    <script>
      (function(){
        var root = document.documentElement;
        function cur(){
          var a = root.getAttribute('data-theme');
          if (a) return a;
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        function label(){
          var b = document.getElementById('themeBtn');
          if (b) b.textContent = cur() === 'dark' ? '☀ Light' : '☾ Dark';
        }
        var btn = document.getElementById('themeBtn');
        if (btn) btn.addEventListener('click', function(){
          var next = cur() === 'dark' ? 'light' : 'dark';
          root.setAttribute('data-theme', next);
          try { localStorage.setItem('theme', next); } catch(e){}
          label();
        });
        label();
      })();
    </script>
  </body>
</html>
